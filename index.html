<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحصول على الشهادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d2b27; --muted: #5d6b66;
    --line: #dcd8cc; --accent: #1f5c4a; --accent-ink: #ffffff; --hover: #eef3f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141a18; --card: #1c2421; --ink: #eef2f0; --muted: #9fb0aa;
            --line: #2c3834; --accent: #5fbf9f; --accent-ink: #0f1a16; --hover: #232d29; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
    line-height: 1.7; min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 1.9rem; margin: 0 0 6px; font-weight: 700; }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type=search] {
    width: 100%; font: inherit; font-size: 1.15rem; padding: 14px 16px;
    border: 2px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink);
  }
  input[type=search]:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #status { margin: 14px 2px; color: var(--muted); min-height: 1.7em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px;
  }
  li:hover { background: var(--hover); }
  .name { font-weight: 600; font-size: 1.05rem; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  a.btn {
    text-decoration: none; font-weight: 600; font-size: .95rem;
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
    color: var(--accent);
  }
  a.btn.primary { background: var(--accent); color: var(--accent-ink); }
  a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) {
    li { flex-direction: column; align-items: stretch; }
    .actions { justify-content: stretch; }
    a.btn { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
<main>
  <h1>الحصول على الشهادة</h1>
  <p class="sub">اكتب اسمك كما سُجّل في الشهادة، ثم اضغط «تحميل».</p>

  <label for="q">الاسم</label>
  <input id="q" type="search" placeholder="مثال: أحمد محمد" autocomplete="off" autofocus>
  <div id="status" aria-live="polite"></div>
  <ul id="results"></ul>
</main>

<script>
  let people = [];
  const q = document.getElementById('q');
  const results = document.getElementById('results');
  const statusEl = document.getElementById('status');

  // Make Arabic search forgiving: ignore diacritics and common letter variants
  function normalize(s) {
    return s
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')   // tashkeel and tatweel
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  fetch('list.json')
    .then(r => r.json())
    .then(data => {
      people = data.map(p => ({ ...p, key: normalize(p.name) }));
    })
    .catch(() => { statusEl.textContent = 'تعذّر تحميل القائمة. حاول مرة أخرى لاحقًا.'; });

  function render() {
    const term = normalize(q.value);
    results.innerHTML = '';
    if (term.length < 3) {
      statusEl.textContent = term.length ? 'اكتب ٣ أحرف على الأقل.' : '';
      return;
    }
    const words = term.split(' ');
    const found = people.filter(p => words.every(w => p.key.includes(w)));
    if (!found.length) {
      statusEl.textContent = 'لا توجد نتيجة. تأكد من كتابة الاسم كما سُجّل.';
      return;
    }
    const shown = found.slice(0, 15);
    statusEl.textContent = found.length > shown.length
      ? `تم العثور على ${found.length} نتيجة. اكتب المزيد من الاسم لتضييق البحث.`
      : `تم العثور على ${found.length} نتيجة.`;

    for (const p of shown) {
      const href = p.file.split('/').map(encodeURIComponent).join('/');
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="name"></span>
        <span class="actions">
          <a class="btn" target="_blank" rel="noopener">عرض</a>
          <a class="btn primary" download>تحميل</a>
        </span>`;
      li.querySelector('.name').textContent = p.name;
      const [view, dl] = li.querySelectorAll('a');
      view.href = href;
      dl.href = href;
      dl.setAttribute('download', p.file.split('/').pop());
      results.appendChild(li);
    }
  }
  q.addEventListener('input', render);
</script>
</body>
</html>
